version: 2

# Exposures = the things OUTSIDE dbt that use our models (dashboards, reports, ML models).
# They appear at the end of the lineage graph: impact analysis starts here.
exposures:
  - name: sales_dashboard
    label: Sales dashboard (Metabase)
    type: dashboard
    maturity: high
    owner:
      name: Sara Martin
      email: sara.martin@shopfast.example
    depends_on:
      - ref('fct_orders')
    description: "Daily revenue, orders and conversion per channel. Opened every morning by the CEO."

  # TODO (Exercise 2): add the Finance monthly revenue report (depends on fct_orders)
  - name: finance_monthly_revenue_report
    label: Finance monthly revenue report
    type: analysis
    owner:
      name: Paul Girard
    depends_on:
      - ref('fct_orders')
    description: "Monthly Finance report on net revenue in euros after refunds and excluding VAT."

  # TODO (Exercise 2): add the churn-prediction ML model (depends on dim_customers)

  - name: churn_prediction_model
    label: Customer churn prediction model
    type: ml
    owner:
      name: Data Science Lead
    depends_on:
      - ref('dim_customers')
    description: "Predicts customer churn using account attributes and order history metrics from dim_customers."
